apiVersion: batch/v1
kind: CronJob
metadata:
  name: delete-old-pods
spec:
  schedule: "* * * * *"  # Run every minute
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: pod-cleaner-sa
          tolerations:
            - key: "amd.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"
          containers:
            - name: pod-cleaner
              image: aigmkt/kubectl-psql:latest
              command:
                - /bin/bash
                - -c
                - |
                  for ns in $(kubectl get ns --no-headers -o custom-columns=":metadata.name"); do
                    echo "Checking namespace: $ns"
                    kubectl get pods -n $ns --no-headers -o custom-columns="NAME:.metadata.name,CREATED:.metadata.creationTimestamp" | while read name creation; do
                      if echo "$name" | grep -q "^jupyter-launcher-"; then
                        age=$(($(date +%s) - $(date -d "$creation" +%s)))
                        if [ $age -gt 14400 ]; then
                          echo "Deleting pod $name in namespace $ns (age: $age seconds)"
                          kubectl delete pod $name -n $ns
                          svc_name="${name}-svc"
                          echo "Attempting to delete service $svc_name in namespace $ns"
                          kubectl delete svc $svc_name -n $ns || echo "Service $svc_name not found or already deleted"

                          echo "Deleting session data from PostgreSQL for pod $name"
                          PGPASSWORD=flaskpass psql -h postgres -U flaskuser -d flaskdb -c "DELETE FROM public.sessions WHERE pod_name='${name}';"
                        fi
                      fi
                    done
                  done
          restartPolicy: OnFailure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-cleaner-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-cleaner-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "namespaces"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-cleaner-role-binding
roleRef:
  kind: ClusterRole
  name: pod-cleaner-role
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: pod-cleaner-sa
    namespace: default